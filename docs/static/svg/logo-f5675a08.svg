<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 512 512"
  fill="none"
  role="img"
  aria-labelledby="logo-title logo-description"
>
  <title id="logo-title">小伴助手</title>
  <desc id="logo-description">
    长出嫩芽的绿色微笑对话气泡，寓意陪伴与成长。
  </desc>
  <!-- 保持透明底与粗线条，便于在浅色页面和小尺寸入口中使用。 -->
  <style>
    .logo-eyes {
      transform-box: fill-box;
      transform-origin: center;
      animation: logo-blink 5.8s ease-in-out infinite;
    }
    @keyframes logo-blink {
      0%,
      42%,
      48%,
      52%,
      58%,
      100% {
        transform: scaleY(1);
      }
      45%,
      55% {
        transform: scaleY(0.08);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo-eyes {
        animation: none;
      }
    }
  </style>
  <path
    d="M254 175C252 151 258 129 277 108"
    stroke="#22765D"
    stroke-width="16"
    stroke-linecap="round"
  />
  <path
    d="M255 139C207 146 168 113 168 67C214 62 252 90 255 139Z"
    fill="#E8C77E"
  />
  <path
    d="M259 129C260 74 309 39 369 48C370 103 323 142 259 129Z"
    fill="#A8C7A0"
  />
  <path
    d="M256 151C128 151 48 214 48 304C48 355 72 395 112 422L93 469C90 477 97 483 105 479L175 449C200 457 227 461 256 461C384 461 464 398 464 304C464 214 384 151 256 151Z"
    fill="#22765D"
  />
  <g class="logo-eyes" fill="#FFFAE8">
    <rect x="174" y="270" width="28" height="38" rx="14" />
    <rect x="310" y="270" width="28" height="38" rx="14" />
  </g>
  <path
    d="M213 344C235 370 277 370 299 344"
    stroke="#FFFAE8"
    stroke-width="18"
    stroke-linecap="round"
  />
</svg>
